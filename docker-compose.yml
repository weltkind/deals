services:
  deals-php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    networks:
      - deals-network
    depends_on:
      - deals-mysql

  deals-nginx:
    image: nginx:stable-alpine
    ports:
      - "8888:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - deals-network
    depends_on:
      - deals-php

  deals-mysql:
    image: mysql:8.0
    ports:
      - "3388:3306"
    environment:
      MYSQL_DATABASE: deals
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: user
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
    networks:
      - deals-network

networks:
  deals-network:
    driver: bridge
